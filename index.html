<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Touch Shortcuts</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="pad" id="pad">
      <div class="slab" id="slab"></div>
      <header class="head">
        <div class="row1">
          <div class="grip" id="grip" aria-label="Drag to move the pad"></div>
          <button class="prof" id="prof" type="button" aria-label="Profile name. Tap to stop all actions"></button>
          <button class="done-btn" id="done" type="button" hidden>Done</button>
          <button class="menu-btn" id="menu-btn" type="button" aria-label="Menu">···<span class="dot" id="dot" hidden></span></button>
        </div>
        <div class="row2" id="status" role="status" aria-live="polite"></div>
      </header>
      <div class="keys" id="keys"></div>
      <div class="menu" id="menu" hidden></div>
    </div>
  </body>
</html>

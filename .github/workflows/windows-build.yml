name: windows-build

on:
  push:
    branches: [main, james-melling/office-hours]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Rust tests (core + Win32 crate)
        run: cargo test --workspace
      - name: Build NSIS installer
        run: npm run tauri build
      - name: Editor page is in the bundle
        shell: bash
        run: test -f dist/editor.html
      - uses: actions/upload-artifact@v4
        with:
          name: touch-shortcuts-windows
          path: target/release/bundle/nsis/*.exe
          retention-days: 14

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Core tests
        run: cargo test -p tsp-core
      - name: App compiles on macOS
        run: cargo check -p touch-shortcuts

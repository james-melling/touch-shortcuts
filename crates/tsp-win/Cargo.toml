[package]
name = "tsp-win"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Win32 layer for touch-shortcuts: SendInput sink, foreground probe, focus tiers"

[dependencies]
tsp-core = { path = "../tsp-core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[package]
name = "tsp-mac"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "macOS layer for touch-shortcuts: CGEvent sink posted to the app behind the pad, frontmost-app tracker"

[dependencies]
tsp-core = { path = "../tsp-core" }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["elcapitan"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }

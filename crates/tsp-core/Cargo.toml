[package]
name = "tsp-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Platform-independent core for touch-shortcuts: combo parsing, profiles, executor, geometry"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: edits write fields back in the order the author wrote them.
serde_json = { version = "1", features = ["preserve_order"] }
